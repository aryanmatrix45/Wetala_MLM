# ==============================================================================
# Nginx Configuration for Panchwati Wellness (panchwatiwellness.com)
#
# Place this file in: /etc/nginx/sites-available/panchwatiwellness
# Symlink to:         /etc/nginx/sites-enabled/panchwatiwellness
# Test with:          sudo nginx -t
# Reload with:        sudo systemctl reload nginx
# ==============================================================================

# HTTP — Redirect all HTTP traffic to HTTPS (Certbot will configure this automatically)
server {
    listen 80;
    listen [::]:80;
    server_name panchwatiwellness.com www.panchwatiwellness.com api.panchwatiwellness.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# MAIN APPLICATION (Frontend + Reverse-Proxied Backend API)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panchwatiwellness.com www.panchwatiwellness.com;

    # SSL Certificates (managed by Certbot: sudo certbot --nginx -d panchwatiwellness.com -d www.panchwatiwellness.com)
    ssl_certificate /etc/letsencrypt/live/panchwatiwellness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panchwatiwellness.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Maximum file upload size (matches backend limits for product images)
    client_max_body_size 25M;

    # Root directory for static React/Vite build
    root /var/www/wetala/frontend/dist;
    index index.html;

    # 1. FRONTEND: Single Page Application (SPA) Routing (handles /products/:slug, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache (hashed JS/CSS from Vite)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 2. BACKEND API: Reverse Proxy to Express on localhost:5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable caching for dynamic API responses
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 3. STATIC UPLOADS: Serve product images uploaded to backend/uploads
    location /uploads/ {
        alias /var/www/wetala/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

# ==============================================================================
# OPTIONAL: DEDICATED SUBDOMAIN FOR API (api.panchwatiwellness.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.panchwatiwellness.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/panchwatiwellness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panchwatiwellness.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/wetala/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
